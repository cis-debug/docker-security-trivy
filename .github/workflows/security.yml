name: Security CI (pytest + Trivy)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Python + tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest
          pytest -q

      # 3) Build Docker image (local to the runner)
      - name: Build Docker image
        run: |
          docker build -t docker-security-trivy:ci ./app

      # 4) Trivy scan (fail on HIGH/CRITICAL)
      - name: Trivy vulnerability scan (via Docker image)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            docker-security-trivy:ci
